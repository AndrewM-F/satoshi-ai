[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test execution
addopts =
    -v
    --tb=short
    --strict-markers
    --durations=10
    --cov=backend
    --cov-report=term-missing
    --cov-report=html
    -p no:warnings

# Async configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = module

# Custom markers
markers =
    unit: marks tests as unit tests (deselect with '-m "not unit"')
    integration: marks tests as integration tests (deselect with '-m integration')
    database: tests that interact with the database
    api: tests that make API calls
    services: tests for service layer components
    slow: marks tests as slow (deselect with '-m "not slow"')
    flaky: marks tests that are known to be flaky

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# JUnit XML output (for CI)
junit_suite_name = pytest
junit_logging = all
junit_log_passing_tests = true
