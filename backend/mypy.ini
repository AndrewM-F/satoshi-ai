[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True

# Use explicit package bases to handle module naming conflicts
explicit_package_bases = True
mypy_path = .

# Explicit module configurations
[mypy.api_gateway.app.main]

[mypy.services.meet.meet_service]

# Exclude any test directories from type checking
exclude = '(/tests/|/__pycache__/|/venv/|/migrations/)'

# Add any third-party modules that need to be ignored
[mypy-psycopg2.*]
ignore_missing_imports = True

[mypy-fastapi.*]
ignore_missing_imports = True

[mypy-pydantic.*]
ignore_missing_imports = True
