name: Backend CI

on:
  push:
    branches: [main, staging]
    paths:
      - 'backend/**'
      - 'tests/!(*database*)/**'
      - 'tests/conftest.py'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, staging]
    paths:
      - 'backend/**'
      - 'tests/!(*database*)/**'
      - 'tests/conftest.py'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    name: Test Backend API & Services
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install package with test & dev dependencies
          pip install -e ".[test,dev]"
        continue-on-error: false

      - name: Run linter (black)
        working-directory: ./backend
        run: black --check .

      - name: Run type checking (mypy)
        working-directory: ./backend
        run: |
          # Ensure all Python files are in the Python path
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          if [ -f "mypy.ini" ]; then
            mypy --config-file=mypy.ini .
          else
            echo "mypy.ini not found, using default configuration"
            mypy .
          fi
        continue-on-error: false

      - name: Run tests with pytest
        working-directory: .
        env:
          # Database configuration
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test

          # Supabase configuration
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://dummy-supabase-url.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'dummy-anon-key' }}
        run: |
          # Run all tests except database tests
          pytest -v --ignore=tests/database --cov=backend --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
