[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "." }
packages = ["backend"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.json"]

[project]
name = "satoshi-ai"
version = "0.1.0"
description = "Satoshi AI Backend Services"
requires-python = ">=3.8"
dependencies = [
    # Core
    "fastapi>=0.104.1",
    "uvicorn>=0.24.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.2",
    
    # HTTP/Async
    "httpx>=0.25.2",
    
    # Supabase
    "supabase>=2.3.4",
    "postgrest",
    "realtime",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    
    # Database
    "sqlalchemy>=2.0.23",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.12.1",
    
    # Data Validation
    "pydantic[email]>=2.4.2"
]

[project.optional-dependencies]
test = [
    # Core testing
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "pytest-xdist>=3.0.0",
    "coverage>=7.0.0",
    
    # HTTP/API testing
    "respx>=0.20.0",
    "httpx>=0.24.0",
    
    # Test data and utilities
    "freezegun>=1.2.0",
    "factory-boy>=3.2.0",
    "Faker>=15.0.0"
]
dev = [
    "black>=23.12.1",
    "isort>=5.0.0",
    "mypy>=0.910",
    "flake8>=3.9.0",
]

[project.scripts]
satoshi-ai = "backend.cli:main"

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v -s --cov=backend --cov-report=term-missing --cov-report=html"
asyncio_mode = "auto"
